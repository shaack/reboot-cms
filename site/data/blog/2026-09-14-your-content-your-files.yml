title:
  en: Your content, your files
  de: Deine Inhalte, deine Dateien
description:
  en: Why a website whose pages are plain files outlives every redesign, every host and every CMS that comes after it.
  de: Warum eine Website, deren Seiten einfache Dateien sind, jedes Redesign, jeden Hoster und jedes spätere CMS überdauert.
