title: What is new in Reboot CMS 4
description: Pages made of form blocks, data apart from the pages, entries that are pages of their own. And Markdown keeps working.
date: 2026-11-08
links: |
  - [Upgrading to Reboot CMS 4](https://github.com/shaack/reboot-cms/blob/distrib-4/docs/upgrade-to-4.md)
  - [Structure for editors, freedom for designers](blog/2026-10-12-structure-for-editors-freedom-for-designers)
  - [Seminars, an example of data](seminars)
  - [Documentation](documentation)
body: |-
  Reboot CMS started as a Markdown CMS with blocks. A page was a text file, and HTML comments split it into blocks that templates rendered. That still works. Version 4 adds a second way to build a page, and it becomes the default: a page made of blocks that are forms.

  ## Pages made of form blocks

  A structured page is a short YAML file, `site/pages/about.yml` for the address `/about`. It holds a title, a description and a list of blocks. Each block has a type and the values of its fields, a heading, a text, an image or a list of features.

  A block type is a folder in `site/blocks/` with two files. The blueprint names the fields, the PHP template places them in the HTML. The admin builds the form from the blueprint, a panel per block, and shows a live preview next to it that follows the field being edited. Editors fill in content, and the layout stays as the designer made it.

  ## Data apart from the pages

  Some content is no page at all. Seminars, team members, products and blog posts are records with the same fields again and again. In Reboot CMS 4 they live in `site/data/`, one YAML file per entry, described by a blueprint in `site/blueprints/`. The admin has a new section *Data* that lists them as a table and edits them as forms.

  Blocks query the entries. The start page of this demo shows the next three [seminars](seminars), and a seminar that has passed drops out by itself. Change a price in *Data*, and every page that shows the seminar is up to date.

  ## Entries that are pages

  With `url: blog` in its blueprint, every entry of a collection becomes a page at `/blog/<slug>`, rendered by a template next to the blueprint. The post you are reading works like that. It is a file in `site/data/blog/`, not a page in `site/pages/`.

  ## Markdown keeps working

  Nothing of an existing site has to change. Markdown pages, their blocks and their frontmatter work as before, and the admin still creates them on request. A Markdown block can even sit inside a structured page. When a site is ready for forms, the admin converts a Markdown page into a structured page at the same address, and the old file stays in the history.

  ## Smaller things

  Every save of a page keeps the previous version in the history, for structured pages as well. AddOns are folders now, with their own helpers and admin pages. A new AddOn colors the code blocks of a page on the server, the one below for example:

  ```bash
  git clone https://github.com/shaack/reboot-cms.git my-site
  cd my-site
  ./run.sh
  ```

  Reboot CMS 4 is a major update, so a normal update of version 3 does not install it. From version 3.23 on, the page *Update* in the admin offers the upgrade with a button, makes a backup first and keeps the way back. The [upgrade guide](https://github.com/shaack/reboot-cms/blob/distrib-4/docs/upgrade-to-4.md) says what changes. Version 3 keeps getting security fixes, so there is no hurry.
