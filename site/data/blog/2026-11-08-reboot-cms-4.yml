title:
  en: What is new in Reboot CMS 4
  de: Was neu ist in Reboot CMS 4
description:
  en: Pages made of form blocks, data apart from the pages, entries that are pages of their own. And Markdown keeps working.
  de: Seiten aus Formular-Blöcken, Daten getrennt von den Seiten, Einträge, die eigene Seiten sind. Und Markdown funktioniert weiter.
