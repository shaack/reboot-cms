title:
  en: Fast pages without tuning
  de: Schnelle Seiten ohne Tuning
description:
  en: Speed is a feature visitors notice before they read a word. Reboot CMS gets there by leaving things out.
  de: Geschwindigkeit bemerken Besucher, bevor sie ein Wort lesen. Reboot CMS erreicht sie, indem es Dinge weglässt.
