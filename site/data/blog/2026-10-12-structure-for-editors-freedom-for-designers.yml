body:
  en: |-
    Every website team knows the tension. Editors want to change their pages without asking anyone. Designers want the site to look the way it was designed, also six months after launch. Page builders try to serve both and usually serve neither, the editor gets a hundred options and the design gets a hundred variations.

    ## Blocks as the agreement

    Reboot CMS solves this with blocks. A designer defines the building blocks of the site, a hero, a gallery, a row of features, each as a small folder in `site/blocks/`. It holds a template for the HTML and a blueprint that names the fields, a heading, a text, an image, a list of items.

    A page is a list of these blocks. The editor adds a block, fills in its fields and moves it to the right place. The editor decides what the page says and in which order. The block decides how it looks. Neither has to step on the other's ground.

    ## Filling in instead of formatting

    In the admin every block is a small form. A heading is a text field, an image is picked from the media library, a list grows with a button. Editors see only the fields that matter for this block, and nothing they enter can break the layout.

    Next to the form runs a live preview of the page. It scrolls along with the field being edited, so the editor sees right away where the text lands and how it looks. Blocks can be collapsed, moved and switched off for a while without losing their content.

    Because the content carries no design, a redesign does not touch it. Change the templates, and every page follows.

    ## A new block is an afternoon

    When a page needs something new, a comparison table or a team grid, the designer adds a folder with two files. The blueprint lists the fields in a few lines of YAML, and the admin builds the form from it. The template reads the fields with `$block->get()` and renders them in whatever HTML the design needs. There is no framework to learn and no build step.

    Records that appear on several pages, like the seminars or the posts of this blog, live apart from the pages as data. A block can show the next three seminars or the latest posts, and they stay up to date without anyone touching the page.

    ## Markdown, if you like it

    Pages written in Markdown keep working. Some people prefer typing a hash sign to clicking a field, and for them the admin still creates Markdown pages. Such a page can be converted into a structured page later, with its Markdown blocks becoming form blocks where the site provides them.

    The [Markdown blocks page](blocks) of this demo shows each Markdown block next to the text that produces it.
  de: |-
    Jedes Website-Team kennt die Spannung. Die Redaktion will ihre Seiten ändern, ohne jemanden zu fragen. Das Design soll so aussehen wie entworfen, auch sechs Monate nach dem Start. Page-Builder versuchen, beiden gerecht zu werden, und werden meist keinem gerecht. Die Redaktion bekommt hundert Optionen und das Design hundert Varianten.

    ## Blöcke als Vereinbarung

    Reboot CMS löst das mit Blöcken. Wer das Design macht, legt die Bausteine der Site fest, ein Intro, eine Galerie, eine Reihe von Features, jeden als kleinen Ordner in `site/blocks/`. Darin liegen ein Template für das HTML und ein Blueprint, der die Felder benennt, eine Überschrift, einen Text, ein Bild, eine Liste von Einträgen.

    Eine Seite ist eine Liste dieser Blöcke. Die Redaktion fügt einen Block hinzu, füllt seine Felder aus und schiebt ihn an die richtige Stelle. Sie entscheidet, was die Seite sagt und in welcher Reihenfolge. Der Block entscheidet, wie es aussieht. Keiner muss dem anderen ins Gehege kommen.

    ## Ausfüllen statt formatieren

    Im Admin ist jeder Block ein kleines Formular. Eine Überschrift ist ein Textfeld, ein Bild wird aus der Mediathek gewählt, eine Liste wächst per Knopfdruck. Die Redaktion sieht nur die Felder, die für diesen Block zählen, und nichts, was sie eingibt, kann das Layout zerstören.

    Neben dem Formular läuft eine Live-Vorschau der Seite. Sie scrollt mit dem Feld mit, das gerade bearbeitet wird, so sieht man sofort, wo der Text landet und wie er aussieht. Blöcke lassen sich einklappen, verschieben und eine Zeit lang ausschalten, ohne dass ihr Inhalt verloren geht.

    Weil die Inhalte kein Design mitschleppen, berührt ein Redesign sie nicht. Ändere die Templates, und jede Seite zieht mit.

    ## Ein neuer Block ist ein Nachmittag

    Braucht eine Seite etwas Neues, eine Vergleichstabelle oder ein Team-Raster, legt man einen Ordner mit zwei Dateien an. Der Blueprint listet die Felder in ein paar Zeilen YAML, und der Admin baut daraus das Formular. Das Template liest die Felder mit `$block->get()` und gibt sie in dem HTML aus, das das Design braucht. Es gibt kein Framework zu lernen und keinen Build-Schritt.

    Datensätze, die auf mehreren Seiten erscheinen, wie die Seminare oder die Beiträge dieses Blogs, liegen als Daten getrennt von den Seiten. Ein Block kann die nächsten drei Seminare oder die neuesten Beiträge zeigen, und sie bleiben aktuell, ohne dass jemand die Seite anfasst.

    ## Markdown, wenn du magst

    Seiten in Markdown funktionieren weiterhin. Manche tippen lieber eine Raute, als ein Feld anzuklicken, und für sie legt der Admin weiterhin Markdown-Seiten an. Eine solche Seite lässt sich später in eine strukturierte Seite umwandeln, und ihre Markdown-Blöcke werden zu Formular-Blöcken, wo die Site welche bereitstellt.

    Die [Seite mit den Markdown-Blöcken](blocks) dieser Demo zeigt jeden Markdown-Block neben dem Text, der ihn erzeugt.
