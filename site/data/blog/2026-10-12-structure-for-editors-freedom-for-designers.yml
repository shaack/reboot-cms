title:
  en: Structure for editors, freedom for designers
  de: Struktur für die Redaktion, Freiheit für das Design
description:
  en: Pages made of form blocks give editors clear fields to fill in and leave the design to those who made it. No page builder required.
  de: Seiten aus Formular-Blöcken geben der Redaktion klare Felder zum Ausfüllen und überlassen das Design denen, die es gemacht haben. Ohne Page-Builder.
