title: A structured page
description: An example of a structured page, blocks with fields instead of Markdown.
blocks:
  - type: intro
    heading: A structured page
    lead: This page is no Markdown file. It is site/pages/structured.yml, a list of blocks, each with the fields its blueprint names.
    text: |-
      In the admin it is a form, a panel per block. Editors fill in fields, add, move and switch off blocks, and cannot break the layout. The templates read the fields with `$block->get()`.
    button-label: The blocks of this demo
    button-link: /blocks
  - type: features
    heading: How it works
    items:
      - title: A blueprint per block
        text: Next to the template `site/blocks/intro.php` lies `intro.yml`. It names the fields, their types and which are required, the admin builds the form from it.
      - title: Lists of anything
        text: A field of the type `list` repeats its own fields. The features here and the images of the gallery below are lists, as long as the editor makes them.
      - title: Data on the page
        text: A field of the type `entry` points to an entry in Data. The block below shows one seminar, chosen in a select of all seminars.
  - type: seminar-spotlight
    heading: In focus
    seminar: 2027-01-23-building-blocks
    note: |-
      The seminar comes from `site/data/seminars/`. Change its price in Data and this page shows the new one.
  - type: gallery
    heading: Gallery
    inverse: true
    images:
      - image: /media/screenshots/reboot-cms-admin-page-edit.png
        caption: Pages, the Markdown editor
      - image: /media/screenshots/reboot-cms-admin-media.png
        caption: Media
      - image: /media/dummy.svg
        caption: A placeholder
  - type: seminar-teaser
    disabled: true
    heading: Upcoming seminars
    count: 2
