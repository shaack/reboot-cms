    link: seminars
  - type: text
    text:
      en: |-
        ## Entries that are pages

        One line more in the blueprint, and every entry becomes a page of its own:

        ```yaml
        title: Blog
        sort: date desc
        url: blog
        fields:
          title: {type: text, required: true}
          date:  {type: date, required: true}
          body:  {type: markdown}
        ```

        With `url: blog` the file `site/data/blog/2026-11-08-reboot-cms-4.yml` is the page `/blog/2026-11-08-reboot-cms-4`. A template `site/blueprints/blog.php` next to the blueprint renders it. The [blog](blog) of this demo works like that, the block `blog-list` lists its posts.
      de: |-
        ## Einträge, die Seiten sind

        Eine Zeile mehr im Blueprint, und jeder Eintrag wird zu einer eigenen Seite:

        ```yaml
        title: Blog
        sort: date desc
        url: blog
        fields:
          title: {type: text, required: true}
          date:  {type: date, required: true}
          body:  {type: markdown}
        ```

        Mit `url: blog` ist die Datei `site/data/blog/2026-11-08-reboot-cms-4.yml` die Seite `/blog/2026-11-08-reboot-cms-4`. Ein Template `site/blueprints/blog.php` neben dem Blueprint rendert sie. Der [Blog](blog) dieser Demo funktioniert so, der Block `blog-list` listet seine Beiträge.
  - type: text
    text:
      en: |-
        ## Markdown, if you like

        Pages can still be Markdown, with blocks started by an HTML comment. The [Markdown blocks](blocks) of this demo show each one next to the text that produces it. With a `convert` section a blueprint says how to read the Markdown of its block, then the admin converts a Markdown page into a structured page with a click.
      de: |-
        ## Markdown, wenn du magst

        Seiten können weiterhin Markdown sein, mit Blöcken, die ein HTML-Kommentar beginnt. Die [Markdown-Blöcke](blocks) dieser Demo zeigen jeden neben dem Text, der ihn erzeugt. Mit einem Abschnitt `convert` sagt ein Blueprint, wie das Markdown seines Blocks zu lesen ist, dann wandelt der Admin eine Markdown-Seite mit einem Klick in eine strukturierte Seite um.
