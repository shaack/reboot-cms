title: Blueprints in Reboot CMS
description: A blueprint is a short YAML file that names fields. Reboot CMS makes blocks and data from it, with a form in the admin.
blocks:
  - type: intro
    heading: Blueprints
    lead: A short YAML file that names fields. Reboot CMS builds the form from it, checks the content against it, and the template reads the fields.
    image: media/screenshots/reboot-cms-admin-add-block.png
  - type: text
    text: |-
      The same kind of file describes a **block type** for pages and a **collection** of data, seminars or blog posts for example. This page shows both.

      ## What a blueprint says

      A blueprint has a title and a list of fields. Each field has a name, a type and a few options.

      ```yaml
      title: Quote
      fields:
        text:   {type: textarea, required: true}
        author: {type: text}
        photo:  {type: image, help: "A square portrait"}
      ```

      Reboot CMS reads it in three places:

      - **The admin** builds a form from it, a text area, a text field and the media browser. The field `text` is marked as required, the help sits below the photo.
      - **The website** checks the content against it. A value that does not fit is named in the admin after saving, an entry of data that does not fit stays off the website.
      - **The template** reads the fields by their names, `$block->get("author")` for example.

      | Type | In the admin | In the template |
      |------|--------------|-----------------|
      | `text`, `textarea` | a field, a text area | `get()`, escaped for HTML |
      | `markdown` | the Markdown editor | `html()`, rendered |
      | `number`, `date`, `boolean`, `select` | a number, a date picker, a switch, a list | `get()`, `date()` |
      | `image`, `url` | the media browser, a field | `get()` |
      | `list` | items with their own fields, added and moved | `items()` |
      | `entry` | a select of the entries of a collection | `entry()` |

      Further options are `label`, `default`, `min`, `max` and `options`, the [documentation](documentation#data) lists them all.
  - type: text
    text: |-
      ## A block from a blueprint

      A block type is a folder in `site/blocks/` with two files, both named like the folder. The blueprint above becomes `site/blocks/quote/quote.yml`, and the template next to it places the fields in the HTML:

      ```php
      <?php /** @var \Shaack\Reboot\Block $block */ ?>
      <section class="block block-quote">
          <blockquote>
              <p><?= nl2br($block->get("text")) ?></p>
              <?php if ($block->get("author")) { ?>
                  <footer><?= $block->get("author") ?></footer>
              <?php } ?>
          </blockquote>
      </section>
      ```

      From now on *Add block* in the admin offers "Quote". The page stores what the editor fills in as YAML, `site/pages/about.yml` for the address `/about`:

      ```yaml
      title: About us
      blocks:
        - type: quote
          text: We build websites that load fast.
          author: Jane Doe
      ```

      Editors fill in fields and cannot break the layout. Designers change the template, and every page with a quote follows.
  - type: features
    heading: Blocks of this demo
    items:
      - title: intro, text, image-text
        text: The bands of a page, with headings, Markdown and images. A `boolean` field `inverse` turns an image-text into a white band.
      - title: features, gallery
        text: A `list` field each. The editor adds as many features or images as the page needs, each item with its own fields.
      - title: seminar-spotlight
        text: An `entry` field. The editor chooses one seminar from a list, the template shows its date, place and price.
  - type: image-text
    text: |-
      ## Data from a blueprint

      Seminars, posts, products, team members. Content with the same fields again and again is no page, it is data. A blueprint in `site/blueprints/` describes it, `seminars.yml` in this demo:

      ```yaml
      title: Seminars
      sort: date
      columns: [date, title, location, price]
      fields:
        title:    {type: text, required: true}
        date:     {type: date, required: true}
        location: {type: text, required: true}
        price:    {type: number, label: "Price (€)", min: 0}
        body:     {type: markdown, label: Description}
      ```

      Each entry is a Markdown file in `site/data/seminars/`. The fields are its frontmatter, the text below it is `body`. The admin lists the entries under *Data* as a table with the `columns` and edits each one as a form.
    image: media/screenshots/reboot-cms-admin-data.png
    alt: The table of the seminars in the admin
    caption: The seminars of this demo under Data
  - type: text
    text: |-
      ## Data in a block

      A block or a PHP page queries the collection and decides where the entries show up. The block `seminar-teaser` lists the next seminars like this:

      ```php
      <?php
      $next = $site->collection("seminars")
          ->where("date", ">=", "today")
          ->limit(3);
      foreach ($next as $seminar) { ?>
          <h3><?= $seminar->get("title") ?></h3>
          <p><?= $seminar->date("date", "d.m.Y") ?>, <?= $seminar->get("location") ?></p>
      <?php } ?>
      ```

      Past seminars drop out on their own. Change a price in *Data*, and every page that shows the seminar is up to date. This is the block, on this page:
  - type: seminar-teaser
    heading: The next seminars
    count: 3
    link-label: All seminars
    link: seminars
  - type: text
    text: |-
      ## Entries that are pages

      One line more in the blueprint, and every entry becomes a page of its own:

      ```yaml
      title: Blog
      sort: date desc
      url: blog
      fields:
        title: {type: text, required: true}
        date:  {type: date, required: true}
        body:  {type: markdown}
      ```

      With `url: blog` the file `site/data/blog/2026-11-08-reboot-cms-4.md` is the page `/blog/2026-11-08-reboot-cms-4`. A template `site/blueprints/blog.php` next to the blueprint renders it. The [blog](blog) of this demo works like that, the block `blog-list` lists its posts.
  - type: text
    text: |-
      ## Markdown, if you like

      Pages can still be Markdown, with blocks started by an HTML comment. The [Markdown blocks](blocks) of this demo show each one next to the text that produces it. With a `convert` section a blueprint says how to read the Markdown of its block, then the admin converts a Markdown page into a structured page with a click.
