  - type: text
    text:
      en: |-
        ## Up and running in a minute

        Clone the repository and start it. The included script runs Apache and PHP in a container, the same setup as on a typical web host.

        ```bash
        git clone https://github.com/shaack/reboot-cms.git my-site
        cd my-site
        ./run.sh
        ```

        The site is at `http://localhost:21007`, the admin at `http://localhost:21007/admin`. On a server, point the document root at `web/` and open `/admin` to create the first account.

        Reboot CMS is open source under the MIT license. Read [what is new in Reboot CMS 4](blog/2026-11-08-reboot-cms-4), the [documentation](documentation), or go straight to the [repository on GitHub](https://github.com/shaack/reboot-cms).
      de: |-
        ## In einer Minute startklar

        Klone das Repository und starte es. Das mitgelieferte Skript startet Apache und PHP in einem Container, mit demselben Aufbau wie bei einem typischen Webhoster.

        ```bash
        git clone https://github.com/shaack/reboot-cms.git my-site
        cd my-site
        ./run.sh
        ```

        Die Site läuft unter `http://localhost:21007`, der Admin unter `http://localhost:21007/admin`. Auf einem Server lässt du das Document Root auf `web/` zeigen und öffnest `/admin`, um das erste Konto anzulegen.

        Reboot CMS ist Open Source unter der MIT-Lizenz. Lies, [was neu ist in Reboot CMS 4](blog/2026-11-08-reboot-cms-4), die [Dokumentation](documentation) oder geh direkt zum [Repository auf GitHub](https://github.com/shaack/reboot-cms).
