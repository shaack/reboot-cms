title: Reboot CMS, the flat file CMS with blocks
description: Reboot CMS is a small and fast flat file CMS in PHP. Pages are made of blocks with fields, content lives in files, no database needed.
blocks:
  - type: intro
    heading: Reboot CMS
    lead: The flat file CMS that thinks in blocks.
    text: A page is a list of **blocks**, and every block is a small form. Editors fill in fields, designers own the templates, and a small PHP core delivers it fast. No database, no build step, nothing to migrate.
    button-label: View on GitHub
    button-link: https://github.com/shaack/reboot-cms
  - type: seminar-teaser
    heading: Upcoming seminars
    count: 3
    link-label: All seminars
    link: seminars
  - type: features
    heading: Features
    items:
      - title: Just files
        text: A page is a readable YAML file, and its path is its URL. Put the site under Git and every change becomes a reviewable diff. Backups are a copy of a folder.
      - title: Forms, not markup
        text: A block type is a PHP template and a blueprint that names its fields. The admin builds the form from it, so editors cannot break the layout.
      - title: Fast by default
        text: No database, no framework, no queries. Pages render in milliseconds and ship without the weight of a classic CMS. Sites built with Reboot CMS score 100 on PageSpeed Insights.
    inverse: true
  - type: image-text
    text: |-
      ## Edit in the browser

      The admin edits a page as a form, a panel per block, with a live preview that follows the field you type in. It keeps a history of every page and manages data, media, users, protected areas and secure downloads. Updates come straight from GitHub with one click, and a backup is one more.

      [See the admin in the documentation](documentation#admin-interface)
    image: media/screenshots/reboot-cms-admin-page-edit.png
    alt: The page editor of the admin
    caption: Editing a page
  - type: image-text
    text: |-
      ## Made for AI agents

      An agent does well with Reboot CMS for the same reason you do. Content is text, the URL names the file, and the whole core fits into a context window. The repository ships an `AGENTS.md` that orients coding assistants, so "add a page about pricing" is a task an agent completes on its own.

      [Read how it works](documentation#working-with-ai-agents)
    image: media/screenshots/reboot-cms-admin-media.png
    alt: The media manager of the admin
    caption: The media manager
    image-position: left
  - type: features
    heading: Content apart from layout
    items:
      - title: Data
        text: Seminars, posts, products. A blueprint in `site/blueprints/` names their fields, the entries live in `site/data/`, and blocks show them where they fit.
      - title: Pages from data
        text: 'With `url: blog` in its blueprint, every entry is a page of its own. The posts of the [blog](blog) work like that.'
      - title: Markdown, if you like
        text: Markdown pages still work and are handy for long texts. The admin converts one into a structured page with a click.
    inverse: true
  - type: seminar-spotlight
    heading: In focus
    seminar: 2027-01-23-building-blocks
    note: The seminar comes from `site/data/seminars/`. Change its price in Data and this page shows the new one.
  - type: gallery
    heading: The admin at a glance
    images:
      - image: media/screenshots/reboot-cms-admin-page-edit.png
        caption: 'Pages: a form per block, with live preview'
      - image: media/screenshots/reboot-cms-admin-data.png
        caption: 'Data: records with fields, apart from the pages'
      - image: media/screenshots/reboot-cms-admin-protected-areas.png
        caption: 'Protected areas: customer logins by password or mail link'
      - image: media/screenshots/reboot-cms-admin-secure-downloads.png
        caption: 'Secure downloads: send a file with a link and a password'
  - type: content
    text: |-
      ## Up and running in a minute

      Clone the repository and start it. The included script runs Apache and PHP in a container, the same setup as on a typical web host.

      ```bash
      git clone https://github.com/shaack/reboot-cms.git my-site
      cd my-site
      ./run.sh
      ```

      The site is at `http://localhost:21007`, the admin at `http://localhost:21007/admin`. On a server, point the document root at `web/` and open `/admin` to create the first account.

      Reboot CMS is open source under the MIT license. Have a look at the [Markdown blocks](blocks), read the [blog](blog) and the [documentation](documentation), or go straight to the [repository on GitHub](https://github.com/shaack/reboot-cms).
    inverse: true
author: shaack.com
