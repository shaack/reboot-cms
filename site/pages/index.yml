title: Reboot CMS, the flat file CMS with blocks
description: Reboot CMS is a small and fast flat file CMS in PHP. Pages are made of blocks with fields, content lives in files, no database needed.
blocks:
  - type: intro
    heading: Reboot CMS
    lead: The flat file CMS that thinks in blocks.
    image: media/screenshots/reboot-cms-admin-page-edit.png?v=4
    button-label: View on GitHub
    button-link: https://github.com/shaack/reboot-cms
  - type: features
    heading: Why Reboot CMS
    items:
      - title: Just files
        text: A page is a short YAML file, and its path is its URL. Put the site under Git and every change becomes a reviewable diff. A backup is a copy of a folder.
      - title: Build pages out of blocks
        text: A block type is a PHP template and a blueprint that names its fields. The admin builds the form from it, so editors fill in content and cannot break the layout.
      - title: Fast by default
        text: No database, no framework, no queries. Pages render in milliseconds and ship without the weight of a classic CMS. Sites built with Reboot CMS score 100 on PageSpeed Insights.
  - type: image-text
    text: |-
      ## Pages are forms

      The admin edits a page as a list of panels, one per block. *Add block* offers the block types of the site, and the live preview next to the form follows the field you type in. A click into the preview jumps to the block it shows.

      Every save keeps the previous version, so nothing an editor does is final.

      [How structured pages work](documentation#structured-pages)
    image: media/screenshots/reboot-cms-admin-add-block.png
    alt: A structured page in the admin with the menu Add block open
    caption: Add block offers the block types of the site
  - type: image-text
    text: |-
      ## Data as a first-class citizen

      Seminars, posts, products, team members. A blueprint in `site/blueprints/` names their fields, the entries are files in `site/data/`, and the admin lists them as a table. Blocks show them wherever they fit.

      Change the price of a seminar once, and every page that shows it is up to date. With `url: blog` in its blueprint every entry becomes a page of its own, the posts of the [blog](blog) work like that.

      [How data works](documentation#data)
    image: media/screenshots/reboot-cms-admin-data.png
    alt: The table of the seminars in the admin
    caption: The seminars of this demo as data
    image-position: left
  - type: seminar-teaser
    heading: Data on a page, the next seminars
    count: 3
    link-label: All seminars
    link: seminars
  - type: features
    heading: Everything a small site needs
    items:
      - title: Markdown, if you like
        text: Markdown pages still work and are handy for long texts. The admin converts one into a structured page with a click, see the [Markdown blocks](blocks).
      - title: Protected areas
        text: Pages for customers or members, behind a password or a login link by mail. Accounts are managed in the admin.
      - title: Made for AI agents
        text: Content is text, the URL names the file, and the whole core fits into a context window. The `AGENTS.md` of the repository orients coding assistants.
  - type: gallery
    heading: The admin at a glance
    images:
      - image: media/screenshots/reboot-cms-admin-page-edit.png?v=4
        caption: 'Pages: a form per block, with live preview'
      - image: media/screenshots/reboot-cms-admin-add-block.png
        caption: 'Add block: the block types of the site'
      - image: media/screenshots/reboot-cms-admin-data.png
        caption: 'Data: records with fields, apart from the pages'
      - image: media/screenshots/reboot-cms-admin-markdown-edit.png
        caption: 'Markdown pages: text with blocks, with preview'
      - image: media/screenshots/reboot-cms-admin-page-history.png?v=4
        caption: 'History: every earlier version of a page'
      - image: media/screenshots/reboot-cms-admin-media.png?v=4
        caption: 'Media: upload, browse and pick images'
      - image: media/screenshots/reboot-cms-admin-protected-areas.png?v=4
        caption: 'Protected areas: logins by password or mail link'
      - image: media/screenshots/reboot-cms-admin-secure-downloads.png?v=4
        caption: 'Secure downloads: a file with a link and a password'
  - type: text
    text: |-
      ## Up and running in a minute

      Clone the repository and start it. The included script runs Apache and PHP in a container, the same setup as on a typical web host.

      ```bash
      git clone https://github.com/shaack/reboot-cms.git my-site
      cd my-site
      ./run.sh
      ```

      The site is at `http://localhost:21007`, the admin at `http://localhost:21007/admin`. On a server, point the document root at `web/` and open `/admin` to create the first account.

      Reboot CMS is open source under the MIT license. Read [what is new in Reboot CMS 4](blog/2026-11-08-reboot-cms-4), the [documentation](documentation), or go straight to the [repository on GitHub](https://github.com/shaack/reboot-cms).
