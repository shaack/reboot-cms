title: Seminars
description: Seminars on Reboot CMS. An example of data that lives apart from the pages.
blocks:
  - type: content
    text: |-
      # Seminars

      The seminars on this page are data, not pages. Each one is a Markdown file in `site/data/seminars/`, and the blueprint `site/blueprints/seminars.yml` names their fields. The admin edits them under *Data* as a form and lists them as a table.

      The blocks below query the entries. Past seminars and drafts drop out on their own, and a price changed in *Data* shows up on every page at once. The seminars are made up, they only show how data works.
  - type: seminar-spotlight
    heading: In focus
    seminar: 2027-03-12-agents-and-content
    note: The block `seminar-spotlight` points to one entry, chosen in the admin from a list of the seminars.
  - type: seminar-teaser
    heading: All dates
    count: 20
