# Any number of features side by side, each with a title and a text,
# on a white band over the full width on the start page, dark elsewhere
title: Features
fields:
  heading: {type: text}
  items:
    type: list
    label: Features
    min: 1
    fields:
      title: {type: text, required: true}
      text:  {type: markdown}
# Converting a Markdown page turns its `features` blocks into this block,
# each column one feature
convert:
  from: features
  fields:
    items:
      each: part
      fields:
        title: "//h3"
        text:  {part: 1, strip-heading: true}
