# Images with captions, they open enlarged in the lightbox
title: Gallery
fields:
  heading: {type: text}
  images:
    type: list
    label: Images
    min: 1
    fields:
      image:   {type: image, required: true}
      caption: {type: text}
  inverse: {type: boolean, help: "A white band over the full width"}
# Converting a Markdown page turns its `cards` blocks into this block
convert:
  from: cards
  fields:
    heading: "//h2"
    images:
      each: "//li/img"
      fields:
        image:   "@src"
        caption: "@alt"
