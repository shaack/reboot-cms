# An introduction with heading, text, image and a button
title: Intro
fields:
  heading:      {type: text, required: true}
  lead:         {type: textarea, help: "One or two sentences below the heading"}
  text:         {type: markdown}
  image:        {type: image}
  button-label: {type: text, label: Button label}
  button-link:  {type: url, label: Button link}
  inverse:      {type: boolean, help: "A white band over the full width"}
# Converting a Markdown page turns its `hero` blocks into this block
convert:
  from: hero
  fields:
    heading:      "/h1[part(1)]"
    lead:         "/p[part(1)]"
    text:         {part: 2}
    button-link:  "//a[part(3)]/@href"
    button-label: "//a[part(3)]"
