# An introduction with heading, lead, image and a button
title: Intro
fields:
  heading:      {type: text, required: true}
  lead:         {type: textarea, help: "One or two sentences below the heading"}
  image:        {type: image}
  button-label: {type: text, label: Button label}
  button-link:  {type: url, label: Button link}
  inverse:      {type: boolean, help: "Dark on the start page as well, on every other page the intro is dark anyway"}
# No `convert`: the Markdown intro has a text between lead and button that this
# block has no field for, so a converted page keeps it as a Markdown block
