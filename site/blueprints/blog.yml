# The posts of the blog in site/data/blog/, see the README section "Data".
# `url: blog` makes every post a page at /blog/<slug>, rendered by blog.php
# next to this file. The block `blog-list` lists them.
title: Blog
sort: date desc
url: blog
columns: [date, title]
fields:
  title:       {type: text, required: true}
  date:        {type: date, required: true}
  description: {type: textarea, help: "A sentence for the list of posts and for search engines"}
  body:        {type: markdown, label: Text, required: true}
  links:       {type: markdown, label: Further reading, help: "A list of links, shown next to the text"}
