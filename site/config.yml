# AddOns of this site, one site AddOn and 4 core AddOns. Disable them, if not needed.
addons: ["ExampleAddOn", "EmailObfuscation", "ProtectedAreas", "SecureDownloads", "CodeHighlighting"]
protectedAreas: { areas: [ /customers ] }
# the languages of the site, the first is the default, see "Multilingual sites" in the README
languages: [en, de]
defaultLanguage: en
navbar:
  brand: Reboot CMS
  # the path of each entry and its label, a label per language or one for all
  structure:
    /: {en: Home, de: Start}
    /seminars: {en: Seminars, de: Seminare}
    /blog: Blog
    /blueprints: Blueprints
    /documentation: {en: Documentation, de: Dokumentation}
