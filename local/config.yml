# Local configuration

# The `Logger` logs as the standard PHP error_log
# 0 = debug, 1 = info, 2 = error

logLevel: 2 # <= set to 2 in production

# Print PHP notices, warnings and fatals into the page.
# Leave this out and the log level decides: on in debug mode (0), off otherwise.
# Keep it off in production, a diagnostic message in the page body discloses the server path.
# displayErrors: false

# Font family and size for the admin editor textareas
editor:
  font: 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'
  fontSize: '0.95rem'
  lineHeight: '1.4'
  tabSize: 4
  wordWrap: true
  tools:
    - Headings
    - "|"
    - Bold
    - Italic
  #  - Strikethrough
    - "|"
    - UnorderedList
    - OrderedList
    - "|"
    - InsertLink
    - InsertImage

# Page history: number of snapshots to keep per page
history:
  maxVersions: 50

# Mail: lets AddOns send mail, for example login links or form submissions.
# Optional. The System Health page shows the state and sends a test mail.
# transport: smtp (a mailbox of your hosting), mail (PHP mail()) or log (nothing is sent)
# mail:
#   transport: smtp
#   host: mail.example.com
#   port: 465
#   encryption: ssl           # ssl (port 465), tls (STARTTLS, port 587) or none
#   username: noreply@example.com
#   password: "secret"
#   from: noreply@example.com
#   fromName: "Example Inc."
#   replyTo: office@example.com
